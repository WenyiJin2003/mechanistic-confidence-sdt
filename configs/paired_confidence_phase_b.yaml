analysis:
  seed: 20261007
  bootstrap_samples: 2000
  bootstrap_seed: 161803
  null_repetitions: 200
  random_directions: 200
  logistic_c: 1.0
  max_iter: 2000
  primary_test_accuracy_min: 0.65
output:
  results_dir: results/paired_confidence_phase_b
  cache_dir: cache/paired_confidence
  plot: plots/paired_confidence_pairwise_results.png
